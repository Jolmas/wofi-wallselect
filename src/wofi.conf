# ---------------------------------------------------------------------------
# Configuración de wofi para wallselect
# ---------------------------------------------------------------------------
# wallselect.sh la pasa con: wofi --conf ~/.config/wofi/wallselect/wofi.conf
#
# La geometría (width, height, columns, lines e image_size) la calcula el
# script según la resolución y se pasa por línea de comandos. Aquí no se
# define para que el menú se adapte a cualquier pantalla.

# --- Posición --------------------------------------------------------------
# Centro del monitor activo.
location=center

# IMPORTANTE: NO definir xoffset ni yoffset mientras se use location=center.
# En wofi, si existe cualquier offset con location=center, la ventana se
# recoloca en la esquina superior izquierda (compatibilidad con rofi).
# Esa era la causa de que el menú no apareciera centrado.

# --- Comportamiento del menú ----------------------------------------------
mode=dmenu
allow_images=true
insensitive=true
no_actions=true
cache_file=/dev/null
matching=contains
orientation=vertical
halign=fill
dynamic_lines=false

# --- Aspecto ---------------------------------------------------------------
# El tema visual completo está en style.css y en el CSS temporal que genera
# wallselect.sh con el fondo difuminado.
gtk_dark=true
